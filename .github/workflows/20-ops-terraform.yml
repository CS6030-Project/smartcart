name: "20 · Ops / Terraform apply"
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: smartcart-terraform-dev
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: cloud/terraform/dev
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_enable_runtime_jobs: ${{ vars.ENABLE_RUNTIME_JOBS || 'false' }}
      TF_VAR_enable_schedule: ${{ vars.ENABLE_SCHEDULE || 'false' }}
      TF_VAR_public_api: ${{ vars.PUBLIC_API || 'false' }}
      TF_VAR_job_image_tag: ${{ vars.JOB_IMAGE_TAG || 'bootstrap' }}
      TF_VAR_source_mode: ${{ vars.SOURCE_MODE || 'scrape' }}
      TF_VAR_discovery_mode: ${{ vars.DISCOVERY_MODE || 'seeds' }}
      TF_VAR_retailers: ${{ vars.RETAILERS || '' }}
      TF_VAR_max_records: ${{ vars.MAX_RECORDS || '25' }}
      TF_VAR_raw_retention_days: ${{ vars.RAW_RETENTION_DAYS || '10' }}
      TF_VAR_db_tier: ${{ vars.DB_TIER || 'db-f1-micro' }}
      TF_VAR_api_max_instances: ${{ vars.API_MAX_INSTANCES || '3' }}
      TF_VAR_schedule_cron: ${{ vars.SCHEDULE_CRON || '0 3 * * *' }}
      TF_VAR_schedule_timezone: ${{ vars.SCHEDULE_TIMEZONE || 'America/Detroit' }}
      TF_VAR_max_age_hours: ${{ vars.MAX_AGE_HOURS || '48' }}
      TF_VAR_enable_api_database: ${{ vars.ENABLE_API_DATABASE || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_TF_SA }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - name: Initialize shared remote state
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=smartcart/dev"
      - name: Plan from reviewed main
        run: terraform plan -input=false -no-color -out=tfplan
      - name: Apply reviewed plan
        run: terraform apply -input=false -no-color tfplan
