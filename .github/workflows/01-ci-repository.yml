name: "01 · CI / Repository"

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  starter-tests:
    name: Java/Python repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run repository tests
        run: bash run-tests.sh
