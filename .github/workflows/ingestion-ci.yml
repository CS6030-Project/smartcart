name: Ingestion CI
on:
  pull_request:
    paths: ["data/ingestion/**", ".github/workflows/ingestion-ci.yml"]
  push:
    paths: ["data/ingestion/**", ".github/workflows/ingestion-ci.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartcart
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: smartcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartcart -d smartcart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: smartcart
      DB_USER: smartcart
      DB_PASSWORD: integration-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r data/ingestion/requirements.txt
      - name: Unit tests
        working-directory: data/ingestion
        run: python -m unittest discover -s tests -v
      - name: End-to-end offline smoke (synthetic records only)
        working-directory: data/ingestion
        run: |
          python -m collector.main --source fixtures --run-id ci-demo --output-dir /tmp/smartcart-test
          python -m loader.main --manifest-uri /tmp/smartcart-test/manifests/ci-demo.json --dry-run
      - name: PostgreSQL integration and idempotent replay
        working-directory: data/ingestion
        run: |
          python -m loader.main --manifest-uri /tmp/smartcart-test/manifests/ci-demo.json
          python -m loader.main --manifest-uri /tmp/smartcart-test/manifests/ci-demo.json
          python - <<'PYTEST'
          import os, psycopg
          with psycopg.connect(host=os.environ['DB_HOST'], dbname=os.environ['DB_NAME'],
                               user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD']) as conn:
              count = conn.execute('SELECT count(*) FROM catalog.retailer_listings').fetchone()[0]
          assert count == 25, f'expected 25 idempotent listings, got {count}'
          print('PostgreSQL integration passed:', count, 'unique listings after replay')
          PYTEST
      - name: Docker builds
        run: |
          docker build -f data/ingestion/Dockerfile.collector data/ingestion
          docker build -f data/ingestion/Dockerfile.loader data/ingestion
